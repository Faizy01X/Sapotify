<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sapotify</title>
    <link rel="icon" type="image/x-icon" href="img/fav3.ico.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="left">
            <div class="close">
                <img src="img/close.svg" alt="">
            </div>
            <div class="home">
                <img src="img/logo.svg" alt="Sapotify" style="filter: invert(1);">
                <ul>
                    <li><img src="img/home.svg" alt="Home" style="filter: invert(1);">Home</li>
                    <li><img src="img/search.svg" alt="Search" style="filter: invert(1);">Search</li>
                </ul>
            </div>
            <div class="library">
                <div class="heading">
                    <img src="img/playlist.svg" style="filter: invert(1);" alt="Playlist">
                    Your Library
                </div>

                <div class="songList">
                    <ul>
                        <li>
                            <img src="img/music.svg" alt="">
                            <div class="info">
                                <div>Song Name</div>
                                <div>Song Artist</div>
                            </div>

                            <div class="playNow">
                                <span>Play Now</span>
                                <img src="img/playbutton.svg" style="filter: invert();" alt="">
                            </div>
                        </li>
                    </ul>
                </div>

                <div class="footer">

                    <ul>
                        <li><a href="https://www.spotify.com/jp/legal/">Legal</a></li>
                        <li><a href="https://www.spotify.com/jp/privacy/">Privacy Center</a></li>
                        <li><a href="https://www.spotify.com/jp/legal/privacy-policy/">Privacy Policy</li>
                        <li><a href="https://www.spotify.com/jp/legal/cookies-policy/">Cookies</a></li>
                        <li><a href="https://www.spotify.com/jp/legal/privacy-policy/#s3">About Ads</a></li>
                        <li><a href="https://www.spotify.com/jp/accessibility/">Accessibility</a></li>
                    </ul>
                </div>
            </div>
        </div>


        <div class="right">
            <div class="header">

                <div class="nav">

                    <div class="hamburgerContainer">
                        <img class="hamburger" src="img/hamburger.svg" alt="">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M15 6L9.70711 11.2929C9.37377 11.6262 9.20711 11.7929 9.20711 12C9.20711 12.2071 9.37377 12.3738 9.70711 12.7071L15 18"
                                stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M9 18L14.2929 12.7071C14.6262 12.3738 14.7929 12.2071 14.7929 12C14.7929 11.7929 14.6262 11.6262 14.2929 11.2929L9 6"
                                stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </div>
                </div>

                <div class="buttons">
                    <button class="signBtn">Sign Up</button>
                    <button class="loginBtn">Log in</button>
                </div>
            </div>

            <div class="spotifyPlaylist">
                <h1>Spotify Playlist</h1>

                <div class="cardContainer">
                    <div data-folder="ncs" class="card">
                    <span class="play"><img  src="img/play.png"></span>
                    <img src="/songs/cs/cover.jpg" alt="">
                    <h2>Kaalu hits</h2>
                    <p>Meow Meow</p>

                </div>
                </div>

            </div>

            <!-- Playbar  -->
            <div class="playbar">
                <div class="songContainer">
                    <marquee><div class="songInfo"></div></marquee>
                    <div class="songTime"></div>
                </div>
                <div class="seekBar">
                    <div class="circle"></div>
                </div>


                <div class="songButtons">
                    <img id="previous" src="img/previousButton.svg" style="filter: invert(1);">
                    <img id="play" src="img/playbutton.svg" alt="" style="filter: invert(1);">
                    <img id="next" src="img/nextButton.svg" alt="" style="filter: invert(1);">
                </div>

                <div class="volControl">
                    <img src="img/shuffle.svg" alt="">

                    <div class="volume">
                        <img src="img/volume.svg" class="volIco">
                        <div class="range">
                            <input type="range" name="volIco">
                        </div>
                    </div>
                </div>



            </div>

        </div>

    </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
